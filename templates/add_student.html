<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Add Student
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>

    <div class="form-container">

        <h1>
            Add New Student
        </h1>


        <form
            action="/add-student"
            method="post"
        >

            <!-- First Name -->

            <label>
                First Name
            </label>

            <input
                type="text"
                name="first_name"
                placeholder="Enter first name"
                required
            >


            <!-- Last Name -->

            <label>
                Last Name
            </label>

            <input
                type="text"
                name="last_name"
                placeholder="Enter last name"
                required
            >


            <!-- Age -->

            <label>
                Age
            </label>

            <input
                type="number"
                name="age"
                placeholder="Enter age"
                required
            >


            <!-- Course -->

            <label>
                Course
            </label>

            <select
                name="course"
                required
            >

                <option value="">
                    Select Course
                </option>

                <option value="Python">
                    Python
                </option>

                <option value="Java">
                    Java
                </option>

                <option value="JavaScript">
                    JavaScript
                </option>

            </select>


            <!-- Submit -->

            <button
                type="submit"
            >

                Create Student

            </button>

        </form>


        <br>


        <a href="/">
            ← Back to Students
        </a>

    </div>

</body>

</html>
